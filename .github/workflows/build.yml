      - name: Build
        run: dotnet build VictusFanControl.sln -c Release --no-restore -warnaserror

      - name: HP 8C40 P14.2 build and verify win-x64 publish layout
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.2-publish'
          .\scripts\build-p14-publish-layout.ps1 -OutputRoot $out
          .\scripts\verify-p14-publish-layout.ps1 -OutputRoot $out

      - name: HP 8C40 P14.3 build and verify deterministic RC package twice
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.3-publish'
          $external = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.3-external'
          $pkg1 = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.4-artifact'
          $pkg2 = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.3-package-b'
          .\scripts\build-p14-publish-layout.ps1 -OutputRoot $publish
          .\scripts\fetch-p14-external-inputs.ps1 -OutputDirectory $external
          $pawn = Join-Path $external 'release_0_2_11.zip'
          .\scripts\package-p14-rc.ps1 -PublishRoot $publish -PawnIoArchivePath $pawn -OutputDirectory $pkg1 -SourceHead '${{ github.sha }}'
          .\scripts\package-p14-rc.ps1 -PublishRoot $publish -PawnIoArchivePath $pawn -OutputDirectory $pkg2 -SourceHead '${{ github.sha }}'
          $zip1 = Join-Path $pkg1 'VictusFanControl-0.4.0-rc.1-win-x64.zip'
          $zip2 = Join-Path $pkg2 'VictusFanControl-0.4.0-rc.1-win-x64.zip'
          .\scripts\verify-p14-package.ps1 -ZipPath $zip1 -Sha256Path ($zip1 + '.sha256') -ExpectedSourceHead '${{ github.sha }}'
          .\scripts\verify-p14-package.ps1 -ZipPath $zip2 -Sha256Path ($zip2 + '.sha256') -ExpectedSourceHead '${{ github.sha }}'
          $hash1 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip1).Hash
          $hash2 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip2).Hash
          if ($hash1 -ne $hash2) { throw "P14.3 deterministic package mismatch: $hash1 vs $hash2" }
          Write-Host "P14.3 reproducible ZIP SHA-256: $hash1"

      - name: HP 8C40 P14.4 stage retained artifact identity
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.4-artifact'
          $artifactName = "VictusFanControl-0.4.0-rc.1-win-x64-${{ github.sha }}"
          .\scripts\write-p14-artifact-attestation.ps1 -ArtifactDirectory $artifactDir -SourceHead '${{ github.sha }}' -Repository '${{ github.repository }}' -Ref '${{ github.ref }}' -RunId '${{ github.run_id }}' -RunNumber '${{ github.run_number }}' -ArtifactName $artifactName
          .\scripts\verify-p14-artifact-stage.ps1 -ArtifactDirectory $artifactDir -ExpectedSourceHead '${{ github.sha }}' -ExpectedRepository '${{ github.repository }}' -ExpectedRef '${{ github.ref }}' -ExpectedRunId '${{ github.run_id }}' -ExpectedRunNumber '${{ github.run_number }}' -ExpectedArtifactName $artifactName

      - name: HP 8C40 M8A representative-load classifier self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --8c40-m8a-self-test

      - name: HP 8C40 M8C synthetic thermal-preemption self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --8c40-m8c-self-test

      - name: Modern Standby M0 observer self-test
        run: dotnet run --project .\src\VictusFanControl.ModernStandbyProbe -c Release --no-build -- --self-test

      - name: Watchdog Gate B restore self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --gate-b-self-test

      - name: Watchdog Gate C lease self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --gate-c-self-test

      - name: HP 8C40 watchdog M2 read-only self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m2-8c40-self-test

      - name: HP 8C40 watchdog M3 restore-only self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m3-8c40-self-test

      - name: HP 8C40 watchdog M4 lease preparation self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m4-8c40-self-test

      - name: Scenario C residual EC policy and sampler self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --residual-ec-investigation-self-test

      - name: HP WMI fan telemetry deterministic self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --fan-wmi-telemetry-self-test

      - name: Opt-in investigation JSONL smoke without hardware
        shell: pwsh
        run: |
          $folder = Join-Path $env:LOCALAPPDATA 'VictusFanControl\logs'
          $before = @(Get-ChildItem $folder -Filter 'ec-wmi-*.log' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $previous = $env:VFC_EC_WMI_DIAGNOSTICS
          try {
            $env:VFC_EC_WMI_DIAGNOSTICS = '1'
            dotnet run --project .\src\VictusFanControl -c Release --no-build -- --fan-wmi-telemetry-self-test
            if ($LASTEXITCODE -ne 0) { throw 'Instrumented software fixtures failed.' }
          } finally { $env:VFC_EC_WMI_DIAGNOSTICS = $previous }
          $files = @(Get-ChildItem $folder -Filter 'ec-wmi-*.log' | Where-Object { $_.FullName -notin $before })
          if ($files.Count -ne 1) { throw 'Opt-in diagnostic session log missing.' }
          $rows = @(Get-Content $files[0].FullName | ForEach-Object { $_ | ConvertFrom-Json })
          if ($rows[0].kind -ne 'session' -or $rows[0].hardwareReadsAdded -or $rows[0].qpcFrequency -le 0 -or -not $rows[0].coreMvid) { throw 'Diagnostic session identity/clock missing.' }
          if (@($rows | Where-Object { $_.Stage -eq 'selftest.fixture' -and $_.Detail -eq 'no hardware I/O' -and $_.TickMs -gt 0 -and $_.Qpc -gt 0 }).Count -ne 1) { throw 'Diagnostic original chronology missing.' }
          if ($files[0].Length -gt 8388608) { throw 'Diagnostic log over file limit.' }
          if ($rows[-1].Stage -ne 'selftest.finished') { throw 'Terminal diagnostic record was lost at process shutdown.' }
          Write-Host 'PASS: opt-in JSONL, original clocks, MVID and bounded file; fixtures only.'

      - name: Offline EC WMI analyzer CLI exports without hardware
        shell: pwsh
        run: |
          $folder = Join-Path $env:LOCALAPPDATA 'VictusFanControl\logs'
          $source = Get-ChildItem $folder -Filter 'ec-wmi-*.log' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $before = (Get-FileHash $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $out = Join-Path $env:RUNNER_TEMP ('vfc-offline-report-' + [Guid]::NewGuid().ToString('N'))
          dotnet run --project .\src\VictusFanControl -c Release --no-build -- --analyze-ec-wmi-trace $source.FullName --analysis-output-dir $out
          if ($LASTEXITCODE -ne 0) { throw 'Offline analyzer CLI failed.' }
          $summary = Get-Content (Join-Path $out 'summary.json') -Raw | ConvertFrom-Json
          if (-not $summary.Analysis.ChronologyConsistent -or $summary.SourceSnapshotSha256 -ne $before -or $summary.Analysis.Pid -le 0) { throw 'Offline identity/coverage/hash failed.' }
          foreach ($name in @('wmi-calls.csv','ec-reads.csv','report.md')) {if (-not (Test-Path (Join-Path $out $name))) {throw "Missing report $name"}}
          if ((Get-FileHash $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $before) {throw 'Offline analyzer changed its source.'}
          Write-Host 'PASS: offline CLI, original source unchanged, exact snapshot SHA-256, JSON/CSV/Markdown exports.'

      - name: Safety gate self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --safety-self-test

      - name: Fan authority self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --control-self-test

      - name: Watchdog lease client protocol and EC contention retry self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --watchdog-lease-client-self-test

      - name: Adaptive fan policy deterministic self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --adaptive-policy-self-test

      - name: HP 8C40 P17 WinForms curve editor self-test
        run: dotnet run --project .\src\VictusFanControl.App -c Release --no-build -- --curve-editor-self-test

      - name: Telemetry and fan acknowledgement coordination self-test
        run: dotnet run --project .\src\VictusFanControl.App -c Release --no-build -- --telemetry-coordination-self-test

      - name: Configurable dashboard WinForms self-test and renders
        run: dotnet run --project .\src\VictusFanControl.App -c Release --no-build -- --dashboard-self-test

      - name: Performance CPU settings persistence self-test
        run: dotnet run --project .\src\VictusFanControl.App -c Release --no-build -- --performance-settings-self-test

      - name: Performance GUI IPC and startup contract self-test
        run: dotnet run --project .\src\VictusFanControl.App -c Release --no-build -- --performance-gui-self-test

      - name: HP BIOS contract self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --bios-contract-self-test

      - name: HP fan backend self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --hp-backend-self-test

      - name: HP 8C40 P14.4 final retained artifact verification
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.4-artifact'
          $artifactName = "VictusFanControl-0.4.0-rc.1-win-x64-${{ github.sha }}"
          .\scripts\verify-p14-artifact-stage.ps1 -ArtifactDirectory $artifactDir -ExpectedSourceHead '${{ github.sha }}' -ExpectedRepository '${{ github.repository }}' -ExpectedRef '${{ github.ref }}' -ExpectedRunId '${{ github.run_id }}' -ExpectedRunNumber '${{ github.run_number }}' -ExpectedArtifactName $artifactName

      - name: HP 8C40 P14.4 upload retained RC artifact
        id: p14_artifact
        uses: actions/upload-artifact@v4
        with:
          name: VictusFanControl-0.4.0-rc.1-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/VictusFanControl-P14.4-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: HP 8C40 P14.4 report retained artifact identity
        shell: pwsh
        env:
          P14_ARTIFACT_ID: ${{ steps.p14_artifact.outputs.artifact-id }}
          P14_ARTIFACT_URL: ${{ steps.p14_artifact.outputs.artifact-url }}
          P14_ARTIFACT_DIGEST: ${{ steps.p14_artifact.outputs.artifact-digest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:P14_ARTIFACT_ID)) { throw 'P14.4 upload did not return an artifact ID.' }
          if ([string]::IsNullOrWhiteSpace($env:P14_ARTIFACT_DIGEST)) { throw 'P14.4 upload did not return an artifact digest.' }
          Write-Host "P14.4 GitHub artifact ID: $env:P14_ARTIFACT_ID"
          Write-Host "P14.4 GitHub artifact digest: $env:P14_ARTIFACT_DIGEST"
          Write-Host "P14.4 GitHub artifact URL: $env:P14_ARTIFACT_URL"

      - name: HP 8C40 P14.5 write final audit evidence
        shell: pwsh
        env:
          P14_RC_ARTIFACT_ID: ${{ steps.p14_artifact.outputs.artifact-id }}
          P14_RC_ARTIFACT_DIGEST: ${{ steps.p14_artifact.outputs.artifact-digest }}
        run: |
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.5-audit'
          $rcStage = Join-Path $env:RUNNER_TEMP 'VictusFanControl-P14.4-artifact'
          $rcName = "VictusFanControl-0.4.0-rc.1-win-x64-${{ github.sha }}"
          .\scripts\write-p14-final-audit-attestation.ps1 -EvidenceDirectory $evidenceDir -RcStageDirectory $rcStage -SourceHead '${{ github.sha }}' -Repository '${{ github.repository }}' -Ref '${{ github.ref }}' -RunId '${{ github.run_id }}' -RunNumber '${{ github.run_number }}' -RcArtifactId $env:P14_RC_ARTIFACT_ID -RcArtifactName $rcName -RcArtifactDigest $env:P14_RC_ARTIFACT_DIGEST
          .\scripts\verify-p14-final-audit-evidence.ps1 -EvidenceDirectory $evidenceDir -RcStageDirectory $rcStage -ExpectedSourceHead '${{ github.sha }}' -ExpectedRepository '${{ github.repository }}' -ExpectedRef '${{ github.ref }}' -ExpectedRunId '${{ github.run_id }}' -ExpectedRunNumber '${{ github.run_number }}' -ExpectedRcArtifactId $env:P14_RC_ARTIFACT_ID -ExpectedRcArtifactName $rcName -ExpectedRcArtifactDigest $env:P14_RC_ARTIFACT_DIGEST

      - name: HP 8C40 P14.5 upload final audit evidence
        id: p14_final_audit
        uses: actions/upload-artifact@v4
        with:
          name: VictusFanControl-P14.5-final-audit-${{ github.sha }}
          path: ${{ runner.temp }}/VictusFanControl-P14.5-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: HP 8C40 P14.5 report final audit evidence identity
        shell: pwsh
        env:
          P14_AUDIT_ARTIFACT_ID: ${{ steps.p14_final_audit.outputs.artifact-id }}
          P14_AUDIT_ARTIFACT_URL: ${{ steps.p14_final_audit.outputs.artifact-url }}
          P14_AUDIT_ARTIFACT_DIGEST: ${{ steps.p14_final_audit.outputs.artifact-digest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:P14_AUDIT_ARTIFACT_ID)) { throw 'P14.5 audit upload did not return an artifact ID.' }
          if ([string]::IsNullOrWhiteSpace($env:P14_AUDIT_ARTIFACT_DIGEST)) { throw 'P14.5 audit upload did not return an artifact digest.' }
          Write-Host "P14.5 audit artifact ID: $env:P14_AUDIT_ARTIFACT_ID"
          Write-Host "P14.5 audit artifact digest: $env:P14_AUDIT_ARTIFACT_DIGEST"
          Write-Host "P14.5 audit artifact URL: $env:P14_AUDIT_ARTIFACT_URL"

      - name: HP 8C40 P17 upload curve editor render
        uses: actions/upload-artifact@v4
        with:
          name: curve-editor-ui
          path: curve-editor-ui.png
          if-no-files-found: error

      - name: Upload configurable dashboard renders
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-ui
          path: dashboard-*-ui.png
          if-no-files-found: error

  acpi-field-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned KMDF source-only ACPI probe and validate native contracts
        shell: powershell
        run: .\scripts\Build-Victus-AcpiFieldProbe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: acpi-field-probe-review-only
          path: |
            artifacts/acpi-field-probe/AcpiFieldProbe.sys
            artifacts/acpi-field-probe/probe-client.exe
            artifacts/acpi-field-probe/contract-test.exe
            artifacts/acpi-field-probe/identity-test.exe
            artifacts/acpi-field-probe/lifecycle-test.exe
            artifacts/acpi-field-probe/build-manifest.json
            artifacts/acpi-field-probe/review-package/*
          if-no-files-found: error
