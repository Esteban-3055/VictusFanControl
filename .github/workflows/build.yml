      - name: HP 8C40 M8C hard-blocked physical-controller preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8c-physical-preparation-invariants.ps1

      - name: HP 8C40 M8C parent physical harness preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8c-harness-invariants.ps1

      - name: HP 8C40 M8 production-race code/CI audit invariant
        shell: pwsh
        run: .\scripts\test-8c40-m8-production-race-audit-invariants.ps1

      - name: HP 8C40 M9 production-watchdog preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9-production-watchdog-invariants.ps1

      - name: HP 8C40 M9B read-only preflight invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9b-readonly-preflight-invariants.ps1

      - name: HP 8C40 M9B evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9b-evidence-packaging.ps1

      - name: HP 8C40 M9C production-path smoke preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9c-production-smoke-invariants.ps1

      - name: HP 8C40 M9C parent harness/failsafe/evidence invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9c-harness-invariants.ps1

      - name: HP 8C40 M9C native tracked child self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9c-tracked-child-selftest.ps1

      - name: HP 8C40 M9C evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9c-evidence-packaging.ps1

      - name: HP 8C40 M9 GUI watchdog service-bootstrap invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9-watchdog-service-bootstrap-invariants.ps1

      - name: HP 8C40 M9D production-lifecycle preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9d-production-lifecycle-invariants.ps1

      - name: HP 8C40 M9D parent harness invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9d-harness-invariants.ps1

      - name: HP 8C40 M9D native tracked child self-test
