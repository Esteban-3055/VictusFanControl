name: build

on:
  push:
    branches: [ main, 'feature/**', 'integration/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VictusFanControl.sln

      - name: Intel RAPL bounded P1 build and recovery fixtures (no hardware IO)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-intel-rapl-p1.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "CPU probe PowerShell 5.1 build/fixtures failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-intel-rapl-p1.ps1 -SelfTest -WriteTest -PL1Watts 20 -PL2Watts 40
          if ($LASTEXITCODE -ne 0) { throw "CPU probe explicit 20/40 PowerShell 5.1 validation failed." }

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host ("PowerShell parse failure in {0}" -f $_.FullName) -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Passive Manual WMI timeout collector fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Collect-Victus-WmiTimeout.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Collect-Victus-WmiTimeout.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Collector PowerShell 5.1 self-test failed.' }

      - name: GM26 response contract fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Test-Victus-AcpiGm26.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-Victus-AcpiGm26.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'GM26 PowerShell 5.1 self-test failed.' }

      - name: ACPI coverage sequence fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Test-Victus-AcpiCoverage.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-Victus-AcpiCoverage.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'ACPI coverage PowerShell 5.1 self-test failed.' }

      - name: ACPI broker metadata fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Export-Victus-AcpiBrokerPreflight.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Export-Victus-AcpiBrokerPreflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Broker preflight PowerShell 5.1 self-test failed.' }

      - name: ACPI broker metadata rejection evidence on non-target Windows runner
        shell: powershell
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP ('broker-preflight-' + [Guid]::NewGuid().ToString('N'))
          $rejected = $false
          try { .\scripts\Export-Victus-AcpiBrokerPreflight.ps1 -RecoveryMetadata -OutputRoot $probeRoot } catch { $rejected = $true }
          if (-not $rejected) { throw 'Non-target preflight accepted.' }
          $folder = @(Get-ChildItem $probeRoot -Directory)
          if ($folder.Count -ne 1) { throw 'Preflight evidence missing.' }
          $summary = Get-Content (Join-Path $folder[0].FullName 'summary.json') -Raw | ConvertFrom-Json
          if ($summary.MetadataCollected -or $summary.ProductionReady -or $summary.AcpiEvaluationPerformed -or $summary.DirectEcAccess -or $summary.FanSetters -or $summary.DriverInstalled) { throw 'Invalid rejected preflight summary.' }
          if ($summary.Reason -notmatch 'probe requires HP 8C40') { throw 'Expected identity rejection missing.' }
          if (Test-Path (Join-Path $folder[0].FullName 'pnputil.json')) { throw 'PnP listing ran before target qualification.' }
          if (Test-Path (Join-Path $folder[0].FullName 'recovery-metadata.json')) { throw 'Recovery query ran before target qualification.' }
          $zip = $folder[0].FullName + '.zip'
          if ((Get-Content ($zip + '.sha256') -Raw).Trim() -ne (Get-FileHash $zip -Algorithm SHA256).Hash) { throw 'ZIP hash mismatch.' }
          $manifest = Get-Content (Join-Path $folder[0].FullName 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($item in $manifest) {
            $file = Get-Item (Join-Path $folder[0].FullName $item.file)
            if ($item.bytes -ne $file.Length -or $item.sha256 -ne (Get-FileHash $file.FullName -Algorithm SHA256).Hash) { throw 'Manifest mismatch.' }
          }

      - name: GM26 parent child rejection on non-target Windows runner
        shell: pwsh
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP ('gm26-rejection-' + [Guid]::NewGuid().ToString('N'))
          $rejected = $false
          try { .\scripts\Test-Victus-AcpiGm26.ps1 -OutputRoot $probeRoot } catch { $rejected = $true; Write-Host ($_ | Out-String) }
          if (-not $rejected) { throw 'Non-target probe was accepted.' }
          $folder = @(Get-ChildItem $probeRoot -Directory)
          if ($folder.Count -ne 1) { throw 'Probe evidence missing.' }
          $summary = Get-Content (Join-Path $folder[0].FullName 'summary.json') -Raw | ConvertFrom-Json
          if ($summary.Healthy -or $summary.Samples -ne 0 -or $summary.ChildExitCode -ne 1) { throw 'Rejected child summary invalid.' }
          if (Test-Path (Join-Path $folder[0].FullName 'calls.jsonl')) { throw 'HP request began before target qualification.' }
          $errorText = Get-Content (Join-Path $folder[0].FullName 'child-error.txt') -Raw
          if ($errorText -notmatch 'probe requires HP 8C40') { throw 'Expected target rejection missing.' }
          if (-not (Test-Path ($folder[0].FullName + '.zip'))) { throw 'Rejected evidence ZIP missing.' }

      - name: ACPI coverage parent child rejection on non-target Windows runner
        shell: powershell
        run: |
          $probeRoot = Join-Path $env:RUNNER_TEMP ('acpi-coverage-rejection-' + [Guid]::NewGuid().ToString('N'))
          $rejected = $false
          try { .\scripts\Test-Victus-AcpiCoverage.ps1 -Correlation -OutputRoot $probeRoot } catch { $rejected = $true; Write-Host ($_ | Out-String) }
          if (-not $rejected) { throw 'Non-target coverage probe was accepted.' }
          $folder = @(Get-ChildItem $probeRoot -Directory)
          if ($folder.Count -ne 1) { throw 'Coverage evidence missing.' }
          $summary = Get-Content (Join-Path $folder[0].FullName 'summary.json') -Raw | ConvertFrom-Json
          if (-not $summary.CorrelationRequested -or -not $summary.FanStatusRequested -or $summary.RequestedSamples -ne 18 -or $summary.MaximumRequests -ne 109) { throw 'Correlation parent configuration invalid.' }
          if ($summary.Healthy -or $summary.ProductionReady -or $summary.Samples -ne 0 -or $summary.ChildExitCode -ne 1) { throw 'Rejected child summary invalid.' }
          if (Test-Path (Join-Path $folder[0].FullName 'calls.jsonl')) { throw 'HP request began before target qualification.' }
          if ((Get-Content (Join-Path $folder[0].FullName 'child-error.txt') -Raw) -notmatch 'probe requires HP 8C40') { throw 'Expected target rejection missing.' }
          if (-not (Test-Path ($folder[0].FullName + '.zip'))) { throw 'Rejected evidence ZIP missing.' }
          $expectedHash = (Get-Content ($folder[0].FullName + '.zip.sha256') -Raw).Trim()
          if ($expectedHash -ne (Get-FileHash ($folder[0].FullName + '.zip') -Algorithm SHA256).Hash) { throw 'Evidence ZIP hash mismatch.' }
          $manifest = Get-Content (Join-Path $folder[0].FullName 'manifest.json') -Raw | ConvertFrom-Json
          foreach ($item in $manifest) {
            if ($item.sha256 -ne (Get-FileHash (Join-Path $folder[0].FullName $item.file) -Algorithm SHA256).Hash) { throw 'Evidence member hash mismatch.' }
          }

      - name: Scenario A passive isolation fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Start-Victus-ScenarioA.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-Victus-ScenarioA.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Scenario A PowerShell 5.1 self-test failed.' }

      - name: WMI-only isolation launcher fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Start-Victus-WmiOnlyInvestigation.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-Victus-WmiOnlyInvestigation.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Isolation PowerShell 5.1 self-test failed.' }

      - name: Scenario B native child fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Start-Victus-ScenarioB.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-Victus-ScenarioB.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Scenario B PowerShell 5.1 self-test failed.' }

      - name: Scenario C residual EC launcher fixtures PowerShell 7 and 5.1
        shell: pwsh
        run: |
          .\scripts\Start-Victus-ScenarioC.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Start-Victus-ScenarioC.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Scenario C PowerShell 5.1 self-test failed.' }

      - name: ACPI collector Windows smoke and ETW session cleanup
        shell: powershell
        run: |
          $captureRoot = Join-Path $env:RUNNER_TEMP ('vfc-acpi-smoke-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $captureRoot | Out-Null
          $context = @{Started=$false;Guarded=$false;Finished=$false}
          $start = {param($path,$state) $state.Started=$true; $state.Path=$path}
          $guard = {param($path,$state) if (-not $state.Started -or $state.Finished -or $path -ne $state.Path) {throw 'Hook order invalid.'}; $state.Guarded=$true}
          $finish = {param($path,$state) if (-not $state.Started -or -not $state.Guarded) {throw 'Hook order invalid.'}; $state.Finished=$true; Set-Content (Join-Path $path 'hook-finished.txt') 'finished-before-zip'}
          .\scripts\Collect-Victus-WmiTimeout.ps1 -RepoRoot $env:GITHUB_WORKSPACE -OutputRoot $captureRoot -CaptureMinutes 0 -EventHours 1 -MaximumEvents 100 -ObservationStarted $start -ObservationGuard $guard -ObservationFinished $finish -ObservationContext $context
          if (-not $context.Finished) { throw 'Collector observation hooks failed.' }
          $result = @(Get-ChildItem $captureRoot -Directory)
          if ($result.Count -ne 1) { throw 'Collector result missing.' }
          $summary = Get-Content (Join-Path $result[0].FullName 'capture-summary.json') -Raw | ConvertFrom-Json
          if ($summary.HardwareReads -or $summary.FanWrites -or $summary.EventChannelsEnabled) { throw 'Collector altered collection scope.' }
          $commands = @(Get-Content (Join-Path $result[0].FullName 'commands.json') -Raw | ConvertFrom-Json)
          $firmware = @($commands | Where-Object { $_.Destination -match 'acpi[\\/]capture.txt$' })
          if ($firmware.Count -ne 1 -or $firmware[0].Status -ne 'ok') { throw 'Static firmware helper failed in Windows.' }
          $tables = @(Get-Content (Join-Path $result[0].FullName 'acpi\tables\tables.json') -Raw | ConvertFrom-Json)
          if (-not (Test-Path (Join-Path $result[0].FullName 'acpi\tables\registry-tables.json'))) { throw 'Registry ACPI coverage metadata missing.' }
          $tables | ConvertTo-Json -Depth 8 | Write-Host
          if (@($tables | Where-Object { $_.Status -eq 'exported-first-instance' }).Count -eq 0) { throw 'Windows firmware API exported no tables.' }
          $enumeration = @(Get-Content (Join-Path $result[0].FullName 'acpi\tables\enumeration.json') -Raw | ConvertFrom-Json)
          if (@($enumeration | Where-Object { $_.Signature -eq 'DSDT' }).Count -gt 0 -and @($tables | Where-Object { $_.Signature -eq 'DSDT' -and $_.Status -eq 'exported-first-instance' }).Count -ne 1) { throw 'Advertised DSDT capture missing.' }
          $sessions = @(Get-Content (Join-Path $result[0].FullName 'etw\sessions.json') -Raw | ConvertFrom-Json)
          foreach ($session in $sessions) {
            if ($session.StartStatus -ne 'ok' -or $session.StopStatus -ne 'ok') { throw 'ETW start/stop failed.' }
            logman.exe query $session.Name -ets 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { throw 'Collector ETW session leaked.' }
          }
          $xml = Get-Content (Join-Path $result[0].FullName 'windows-events\before\System.txt') -Raw
          if ($xml -notmatch 'MESSAGE_JSON') { throw 'Rendered Windows messages missing.' }
          if (-not (Test-Path (Join-Path $result[0].FullName 'windows-events\before\System.evtx'))) { throw 'EVTX export missing.' }
          if (-not (Test-Path ($result[0].FullName + '.zip'))) { throw 'Collector ZIP missing.' }
          $archive = [IO.Compression.ZipFile]::OpenRead($result[0].FullName + '.zip')
          try {if (@($archive.Entries | Where-Object {$_.FullName -match 'hook-finished.txt$'}).Count -ne 1) {throw 'Observation finished after ZIP.'}} finally {$archive.Dispose()}
          Write-Host ('PASS: Windows firmware/messages/EVTX, ZIP and cleanup; ETW sessions=' + $sessions.Count)
          # The negative logman query above is expected; do not propagate its exit code.
          exit 0

