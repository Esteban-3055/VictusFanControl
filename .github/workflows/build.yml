name: build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VictusFanControl.sln

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host ("PowerShell parse failure in {0}" -f $_.FullName) -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Gate E contention and causality invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-e-invariants.ps1

      - name: Gate F double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-f-invariants.ps1

      - name: Gate G0 watchdog clock invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g0-clock-invariants.ps1

      - name: Gate G1 lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g1-invariants.ps1

      - name: Gate G2 5/5 lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g2-invariants.ps1

      - name: HP 8C40 legacy 88F8 isolation invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-legacy-isolation-invariants.ps1

      - name: HP 8C40 M5A controller-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5a-8c40-invariants.ps1

      - name: HP 8C40 M5B watchdog-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5b-8c40-invariants.ps1

      - name: HP 8C40 M5C no-write preflight invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5c-preflight-invariants.ps1

      - name: HP 8C40 M5C destructive double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5c-double-death-invariants.ps1

      - name: HP 8C40 M5D WRITE_ARMED post-WMI pre-Commit invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5d-write-armed-invariants.ps1

      - name: HP 8C40 M5E WRITE_ARMED double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5e-write-armed-double-death-invariants.ps1

      - name: HP 8C40 M6 Modern Standby lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-modern-standby-m6-invariants.ps1

      - name: HP 8C40 M6 preflight/physical harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-modern-standby-m6-harness-invariants.ps1

      - name: HP 8C40 M7 hibernation lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-hibernation-m7-invariants.ps1

      - name: HP 8C40 M7 preflight/physical harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-hibernation-m7-harness-invariants.ps1

      - name: HP 8C40 M8 load/thermal qualification invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8-invariants.ps1

      - name: HP 8C40 M8 no-write preflight invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8-preflight-invariants.ps1

      - name: HP 8C40 M8A representative-load no-write harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8a-invariants.ps1

      - name: HP 8C40 M8B watchdog-backed load harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8b-invariants.ps1

      - name: HP 8C40 M8B native child PID and ExitCode self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8b-tracked-child-selftest.ps1

      - name: HP 8C40 M8C native child PID and ExitCode self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8c-tracked-child-selftest.ps1

      - name: HP 8C40 M8C automatic evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8c-evidence-packaging.ps1

      - name: HP 8C40 M8C EC transient hardening invariant
        shell: pwsh
        run: .\scripts\test-8c40-m8c-ec-transient-invariants.ps1

      - name: HP 8C40 M8C synthetic thermal-preemption invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8c-invariants.ps1

      - name: HP 8C40 M8C hard-blocked physical-controller preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8c-physical-preparation-invariants.ps1

      - name: HP 8C40 M8C parent physical harness preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8c-harness-invariants.ps1

      - name: HP 8C40 M8 production-race code/CI audit invariant
        shell: pwsh
        run: .\scripts\test-8c40-m8-production-race-audit-invariants.ps1

      - name: HP 8C40 M9 production-watchdog preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9-production-watchdog-invariants.ps1

      - name: HP 8C40 M9B read-only preflight invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9b-readonly-preflight-invariants.ps1

      - name: HP 8C40 M9B evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9b-evidence-packaging.ps1

      - name: HP 8C40 M9C production-path smoke preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9c-production-smoke-invariants.ps1

      - name: HP 8C40 M9C parent harness/failsafe/evidence invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9c-harness-invariants.ps1

      - name: HP 8C40 M9C native tracked child self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9c-tracked-child-selftest.ps1

      - name: HP 8C40 M9C evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9c-evidence-packaging.ps1

      - name: HP 8C40 M9 GUI watchdog service-bootstrap invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9-watchdog-service-bootstrap-invariants.ps1

      - name: HP 8C40 M9D production-lifecycle preparation invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9d-production-lifecycle-invariants.ps1

      - name: HP 8C40 M9D parent harness invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9d-harness-invariants.ps1

      - name: HP 8C40 M9D native tracked child self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9d-tracked-child-selftest.ps1

      - name: HP 8C40 M9D evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m9d-evidence-packaging.ps1

      - name: HP 8C40 M9 promotion-readiness invariant
        shell: pwsh
        run: .\scripts\test-8c40-m9-promotion-readiness-invariants.ps1

      - name: HP 8C40 P10 post-M9 software invariant
        shell: pwsh
        run: .\scripts\test-8c40-post-m9-software-invariants.ps1

      - name: HP 8C40 P11 adaptive production adapter invariant
        shell: pwsh
        run: .\scripts\test-adaptive-production-integration-invariants.ps1

      - name: HP 8C40 P12 adaptive candidate curve invariant
        shell: pwsh
        run: .\scripts\test-adaptive-candidate-v1-invariants.ps1

      - name: HP 8C40 P13 final software control-surface invariant
        shell: pwsh
        run: .\scripts\test-p13-control-surface-invariants.ps1

      - name: HP 8C40 P14.1 software readiness baseline invariant
        shell: pwsh
        run: .\scripts\test-p14-software-rc-readiness-invariants.ps1

      - name: Adaptive fan policy isolation/invariant self-test
        shell: pwsh
        run: .\scripts\test-adaptive-policy-invariants.ps1

      - name: HP 8C40 M5-M8 invariants Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          Write-Host ("Windows PowerShell version: {0}" -f $PSVersionTable.PSVersion)
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.x compatibility shell."
          }
          .\scripts\test-watchdog-m5a-8c40-invariants.ps1
          .\scripts\test-watchdog-m5b-8c40-invariants.ps1
          .\scripts\test-watchdog-m5c-preflight-invariants.ps1
          .\scripts\test-watchdog-m5c-double-death-invariants.ps1
          .\scripts\test-watchdog-m5d-write-armed-invariants.ps1
          .\scripts\test-watchdog-m5e-write-armed-double-death-invariants.ps1
          .\scripts\test-8c40-modern-standby-m6-invariants.ps1
          .\scripts\test-8c40-modern-standby-m6-harness-invariants.ps1
          .\scripts\test-8c40-hibernation-m7-invariants.ps1
          .\scripts\test-8c40-hibernation-m7-harness-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8-preflight-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8a-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8b-invariants.ps1
          .\scripts\test-8c40-m8b-tracked-child-selftest.ps1
          .\scripts\test-8c40-m8c-tracked-child-selftest.ps1
          .\scripts\test-8c40-m8c-evidence-packaging.ps1
          .\scripts\test-8c40-m8c-ec-transient-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8c-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8c-physical-preparation-invariants.ps1
          .\scripts\test-8c40-load-thermal-m8c-harness-invariants.ps1
          .\scripts\test-8c40-m8-production-race-audit-invariants.ps1
          .\scripts\test-8c40-m9-production-watchdog-invariants.ps1
          .\scripts\test-8c40-m9b-readonly-preflight-invariants.ps1
          .\scripts\test-8c40-m9b-evidence-packaging.ps1
          .\scripts\test-8c40-m9c-production-smoke-invariants.ps1
          .\scripts\test-8c40-m9c-harness-invariants.ps1
          .\scripts\test-8c40-m9c-tracked-child-selftest.ps1
          .\scripts\test-8c40-m9c-evidence-packaging.ps1
          .\scripts\test-8c40-m9-watchdog-service-bootstrap-invariants.ps1
          .\scripts\test-8c40-m9d-production-lifecycle-invariants.ps1
          .\scripts\test-8c40-m9d-harness-invariants.ps1
          .\scripts\test-8c40-m9d-tracked-child-selftest.ps1
          .\scripts\test-8c40-m9d-evidence-packaging.ps1
          .\scripts\test-8c40-m9-promotion-readiness-invariants.ps1
          .\scripts\test-8c40-post-m9-software-invariants.ps1
          .\scripts\test-adaptive-production-integration-invariants.ps1
          .\scripts\test-adaptive-candidate-v1-invariants.ps1
          .\scripts\test-p13-control-surface-invariants.ps1
          .\scripts\test-p14-software-rc-readiness-invariants.ps1
          .\scripts\test-adaptive-policy-invariants.ps1

      - name: Build
        run: dotnet build VictusFanControl.sln -c Release --no-restore -warnaserror

      - name: HP 8C40 M8A representative-load classifier self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --8c40-m8a-self-test

      - name: HP 8C40 M8C synthetic thermal-preemption self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --8c40-m8c-self-test

      - name: Modern Standby M0 observer self-test
        run: dotnet run --project .\src\VictusFanControl.ModernStandbyProbe -c Release --no-build -- --self-test

      - name: Watchdog Gate B restore self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --gate-b-self-test

      - name: Watchdog Gate C lease self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --gate-c-self-test

      - name: HP 8C40 watchdog M2 read-only self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m2-8c40-self-test

      - name: HP 8C40 watchdog M3 restore-only self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m3-8c40-self-test

      - name: HP 8C40 watchdog M4 lease preparation self-test
        run: dotnet run --project .\src\VictusFanControl.Watchdog -c Release --no-build -- --m4-8c40-self-test

      - name: Safety gate self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --safety-self-test

      - name: Fan authority self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --control-self-test

      - name: Watchdog lease client protocol and EC contention retry self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --watchdog-lease-client-self-test

      - name: Adaptive fan policy deterministic self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --adaptive-policy-self-test

      - name: HP BIOS contract self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --bios-contract-self-test

      - name: HP fan backend self-test
        run: dotnet run --project .\src\VictusFanControl -c Release --no-build -- --hp-backend-self-test