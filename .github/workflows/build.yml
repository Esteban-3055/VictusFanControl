name: build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VictusFanControl.sln

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host ("PowerShell parse failure in {0}" -f $_.FullName) -ForegroundColor Red
              $errors | Format-List | Out-String | Write-Host
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Gate E contention and causality invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-e-invariants.ps1

      - name: Gate F double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-f-invariants.ps1

      - name: Gate G0 watchdog clock invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g0-clock-invariants.ps1

      - name: Gate G1 lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g1-invariants.ps1

      - name: Gate G2 5/5 lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-gate-g2-invariants.ps1

      - name: HP 8C40 legacy 88F8 isolation invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-legacy-isolation-invariants.ps1

      - name: HP 8C40 M5A controller-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5a-8c40-invariants.ps1

      - name: HP 8C40 M5B watchdog-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5b-8c40-invariants.ps1

      - name: HP 8C40 M5C no-write preflight invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5c-preflight-invariants.ps1

      - name: HP 8C40 M5C destructive double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5c-double-death-invariants.ps1

      - name: HP 8C40 M5D WRITE_ARMED post-WMI pre-Commit invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5d-write-armed-invariants.ps1

      - name: HP 8C40 M5E WRITE_ARMED double-death invariant self-test
        shell: pwsh
        run: .\scripts\test-watchdog-m5e-write-armed-double-death-invariants.ps1

      - name: HP 8C40 M6 Modern Standby lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-modern-standby-m6-invariants.ps1

      - name: HP 8C40 M6 preflight/physical harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-modern-standby-m6-harness-invariants.ps1

      - name: HP 8C40 M7 hibernation lifecycle invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-hibernation-m7-invariants.ps1

      - name: HP 8C40 M7 preflight/physical harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-hibernation-m7-harness-invariants.ps1

      - name: HP 8C40 M8 load/thermal qualification invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8-invariants.ps1

      - name: HP 8C40 M8 no-write preflight invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8-preflight-invariants.ps1

      - name: HP 8C40 M8A representative-load no-write harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8a-invariants.ps1

      - name: HP 8C40 M8B watchdog-backed load harness invariant self-test
        shell: pwsh
        run: .\scripts\test-8c40-load-thermal-m8b-invariants.ps1

      - name: HP 8C40 M8B native child PID and ExitCode self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8b-tracked-child-selftest.ps1

      - name: HP 8C40 M8C native child PID and ExitCode self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8c-tracked-child-selftest.ps1

      - name: HP 8C40 M8C automatic evidence packaging self-test
        shell: pwsh
        run: .\scripts\test-8c40-m8c-evidence-packaging.ps1

      - name: HP 8C40 M8C EC transient hardening invariant
        shell: pwsh
        run: .\scripts\test-8c40-m8c-ec-transient-invariants.ps1

      - name: HP 8C40 M8C synthetic thermal-preemption invariant self-test
        shell: pwsh
