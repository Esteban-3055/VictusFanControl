name: release-v1

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: victus-v1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_HEAD: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Refuse duplicate publication and check source identity
        id: admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_HEAD"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$RELEASE_HEAD"
          # List first: API/auth errors fail the job instead of appearing as a missing release.
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if jq -e 'any(.[]; .tag_name == "v1.1.3")' "$RUNNER_TEMP/releases.json" >/dev/null; then
            echo 'v1.1.3 already exists; no tag, notes or assets will be overwritten.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$GH_REPO/git/matching-refs/tags/v1.1.3" > "$RUNNER_TEMP/tags.json"
            if jq -e 'any(.[]; .ref == "refs/tags/v1.1.3")' "$RUNNER_TEMP/tags.json" >/dev/null; then
              echo 'Existing v1.1.3 tag without a release: refusing ambiguous publication.' >&2
              exit 1
            fi
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Require other same-commit software checks
        if: steps.admission.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_HEAD&event=push&per_page=100" > "$RUNNER_TEMP/checks.json"
            if python scripts/check-release-workflows.py "$RUNNER_TEMP/checks.json" "$RELEASE_HEAD"; then
              break
            else
              result=$?
              if [ "$result" -ne 2 ] || [ "$attempt" -eq 60 ]; then exit 1; fi
              sleep 15
            fi
          done
      - uses: actions/download-artifact@v4
        if: steps.admission.outputs.publish == 'true'
        with:
          name: VictusFanControl-1.1.3-win-x64-${{ github.event.workflow_run.head_sha }}
          path: verified-payload
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@v4
        if: steps.admission.outputs.publish == 'true'
        with:
          name: VictusFanControl-1.1.3-Setup-win-x64-${{ github.event.workflow_run.head_sha }}
          path: installer-assets
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify full payload and preserve original build ZIP
        if: steps.admission.outputs.publish == 'true'
        run: python scripts/prepare-github-release.py --payload verified-payload --verified-archive installer-assets/VictusFanControl-1.1.3-win-x64.zip --output release-assets --source-head "$RELEASE_HEAD" --build-run-id "$BUILD_RUN" --repository "$GH_REPO" --checks-json "$RUNNER_TEMP/checks.json"
      - name: Verify same-build installer before publication
        if: steps.admission.outputs.publish == 'true'
        run: python scripts/prepare-installer-assets.py --installer installer-assets/VictusFanControl-1.1.3-Setup-win-x64.exe --source-head "$RELEASE_HEAD" --payload release-assets/VictusFanControl-1.1.3-win-x64.zip --verify --output release-assets
      - name: Publish verified v1.1.3 once
        if: steps.admission.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$RELEASE_HEAD"
          # gh stages asset-bearing releases as drafts, uploads, then publishes.
          gh release create v1.1.3 release-assets/* --target "$RELEASE_HEAD" --title 'VictusFanControl v1.1.3 — HP 8C40 / F.18' --notes-file release/RELEASE-NOTES-v1.1.3.md --latest
          gh release view v1.1.3 --json url,isDraft,isPrerelease,assets
