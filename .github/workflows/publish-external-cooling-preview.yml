name: publish-external-cooling-preview
on:
  push:
    branches: [release/external-cooling-preview-1]
    paths: [.github/workflows/publish-external-cooling-preview.yml]
permissions:
  contents: read
concurrency:
  group: external-cooling-preview-1-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Esteban-3055/VictusFanControl' && github.ref == 'refs/heads/release/external-cooling-preview-1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: bf79edb0fae55c1635dc52aad74d61f10320ff46
    steps:
      - name: Verify staged preview by release ID and exact uploaded digests
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/414446440" > "$RUNNER_TEMP/preview.json"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/checks.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((tmp/"preview.json").read_text())
          assert r["id"]==414446440 and r["tag_name"]=="v1.2.10-preview.1"
          assert r["draft"] is True and r["prerelease"] is True
          assert r["target_commitish"]==os.environ["SOURCE_SHA"]
          expected={"Esp32Simulator-v1.2.10-preview.1-win-x64.zip":{"size":132124,"digest":"sha256:8866ce6da94c7e9f5c8b4ae6a1c0dd45e9d1c38470f92a7b0bdc8977b4461961"},"Esp32Simulator-v1.2.10-preview.1-win-x64.zip.sha256":{"size":111,"digest":"sha256:63e9cdf344037ef790f0a08598e9205984c66f2e70375b60437c63bdc4e6c47c"},"EXTERNAL-COOLING-AUDIT.md":{"size":3273,"digest":"sha256:d08373cdbf1497aaf71d747b447a2ff0563877c55c644ba6874ee99394bf92ad"},"EXTERNAL-COOLING-CI-VALIDATION.json":{"size":1607,"digest":"sha256:72051363d567dad730872ba4e6d18db58996b82c18dd9cb9b5098d61de2b7c05"},"EXTERNAL-COOLING-PROTOCOL.md":{"size":9790,"digest":"sha256:e23491f9073c98cfb56809ee1d53eb5da99cae691265418d4521498214d112ab"},"EXTERNAL-COOLING-USAGE.md":{"size":6526,"digest":"sha256:c9a95599bed55666fb64cc009e40948237ed78a927afa9e006e54921e5cf6d06"},"EXTERNAL-COOLING-VALIDATION.md":{"size":5722,"digest":"sha256:0fd6af6317c456f774e4bff55c71d07510e742891eb2b2749fc3ca5b54ba66e1"},"PREVIEW-PROVENANCE.json":{"size":2542,"digest":"sha256:15c6e1f984550ccb1c46ea99c62c9cbfa32b29711fb7fb9fcff02c6f5c766281"},"VictusFanControl-1.2.9-provenance.json":{"size":4268,"digest":"sha256:a2036307e1d40a704f28850f310fc00ac9e7c69a14d2701e1fa89d0c1328832a"},"VictusFanControl-1.2.9-Setup-win-x64.exe":{"size":168578066,"digest":"sha256:eff46812c317bd383bfb68225a9a1ef83d425ba1f4f1bef460cb514cd32ae089"},"VictusFanControl-1.2.9-Setup-win-x64.exe.provenance.json":{"size":699,"digest":"sha256:c9754cdd84b45dfb8514c71ce0af5322060e61006b1a7e27b7748447646e1d39"},"VictusFanControl-1.2.9-Setup-win-x64.exe.sha256":{"size":108,"digest":"sha256:ec9e5254ebb2923f9778a9f358622b931c230681d4232b3d2ad39aac11fd9043"},"VictusFanControl-1.2.9-win-x64.zip":{"size":6739012,"digest":"sha256:0b0a428c42892438e7078a78623f8d149f4141357f677b371dd2f4b4574ad66c"},"VictusFanControl-1.2.9-win-x64.zip.sha256":{"size":101,"digest":"sha256:8fe4f0c7f889a8a0e0e36cba0268c13657a9fb506e2c7fe40ec0149aa395af83"}}
          assets={a["name"]:a for a in r["assets"]}
          assert assets.keys()==expected.keys()
          for name,e in expected.items():
              a=assets[name]
              assert a["state"]=="uploaded" and a["size"]==e["size"] and a["digest"]==e["digest"], name
          runs=json.loads((tmp/"checks.json").read_text())["workflow_runs"]
          for name in ("build","external-cooling","oem-shadow","cpu-rapl","wmi-fan-experiment"):
              matches=[x for x in runs if x["name"]==name and x["head_sha"]==os.environ["SOURCE_SHA"] and x["head_branch"]=="feature/external-cooling-wifi" and x["event"]=="push"]
              assert matches, name
              x=max(matches,key=lambda x:x["id"])
              assert x["status"]=="completed" and x["conclusion"]=="success", name
          print("14 uploaded assets and all five same-commit workflows verified.")
          PY
      - name: Publish verified preview and preserve latest stable
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/414446440" -F draft=false -F prerelease=true -f make_latest=false > "$RUNNER_TEMP/published.json"
          gh api "repos/$GH_REPO/git/ref/tags/v1.2.10-preview.1" > "$RUNNER_TEMP/tag.json"
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((tmp/"published.json").read_text())
          assert r["draft"] is False and r["prerelease"] is True
          assert r["tag_name"]=="v1.2.10-preview.1" and r["target_commitish"]==os.environ["SOURCE_SHA"]
          assert json.loads((tmp/"tag.json").read_text())["object"]["sha"]==os.environ["SOURCE_SHA"]
          assert json.loads((tmp/"latest.json").read_text())["tag_name"]=="v1.2.9"
          print(r["html_url"])
          PY
