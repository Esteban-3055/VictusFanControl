name: publish-external-cooling-preview
on:
  push:
    branches: [release/external-cooling-preview-1]
    paths: [.github/workflows/publish-external-cooling-preview.yml]
permissions:
  contents: read
concurrency:
  group: external-cooling-preview-1-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Esteban-3055/VictusFanControl' && github.ref == 'refs/heads/release/external-cooling-preview-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: bf79edb0fae55c1635dc52aad74d61f10320ff46
      PREVIEW_TAG: v1.2.10-preview.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf79edb0fae55c1635dc52aad74d61f10320ff46
          persist-credentials: false
      - name: Require exact source, successful CI and unused tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$PREVIEW_TAG" > "$RUNNER_TEMP/tags.json"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/checks.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ["RUNNER_TEMP"])
          tag=os.environ["PREVIEW_TAG"]
          assert not any(r["tag_name"]==tag for r in json.loads((tmp/"releases.json").read_text()))
          assert not any(r["ref"]=="refs/tags/"+tag for r in json.loads((tmp/"tags.json").read_text()))
          runs=json.loads((tmp/"checks.json").read_text())["workflow_runs"]
          for name in ("build","external-cooling","oem-shadow","cpu-rapl","wmi-fan-experiment"):
              matches=[r for r in runs if r["name"]==name and r["head_sha"]==os.environ["SOURCE_SHA"] and r["head_branch"]=="feature/external-cooling-wifi" and r["event"]=="push"]
              assert matches, name
              r=max(matches,key=lambda x:x["id"])
              assert r["status"]=="completed" and r["conclusion"]=="success", name
          PY
      - uses: actions/download-artifact@v4
        with:
          name: VictusFanControl-1.2.9-win-x64-bf79edb0fae55c1635dc52aad74d61f10320ff46
          path: verified-payload
          github-token: ${{ github.token }}
          run-id: 38813973727
      - uses: actions/download-artifact@v4
        with:
          name: VictusFanControl-1.2.9-Setup-win-x64-bf79edb0fae55c1635dc52aad74d61f10320ff46
          path: installer-assets
          github-token: ${{ github.token }}
          run-id: 38813973727
      - uses: actions/download-artifact@v4
        with:
          name: external-cooling-validation-bf79edb0fae55c1635dc52aad74d61f10320ff46
          path: validation-evidence
          github-token: ${{ github.token }}
          run-id: 38813973870
      - name: Verify original product archive and installer
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-github-release.py --payload verified-payload --verified-archive installer-assets/VictusFanControl-1.2.9-win-x64.zip --output release-assets --source-head "$SOURCE_SHA" --build-run-id 38813973727 --checks-json "$RUNNER_TEMP/checks.json" --checks-branch feature/external-cooling-wifi
          python scripts/prepare-installer-assets.py --installer installer-assets/VictusFanControl-1.2.9-Setup-win-x64.exe --source-head "$SOURCE_SHA" --payload release-assets/VictusFanControl-1.2.9-win-x64.zip --verify --output release-assets
          cd release-assets
          echo 'eff46812c317bd383bfb68225a9a1ef83d425ba1f4f1bef460cb514cd32ae089  VictusFanControl-1.2.9-Setup-win-x64.exe' | sha256sum --check -
          echo '0b0a428c42892438e7078a78623f8d149f4141357f677b371dd2f4b4574ad66c  VictusFanControl-1.2.9-win-x64.zip' | sha256sum --check -
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish separate simulator and prepare documentation
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tools/Esp32Simulator/Esp32Simulator.csproj -c Release -r win-x64 --self-contained false -warnaserror -o "$RUNNER_TEMP/simulator"
          cp docs/EXTERNAL-COOLING-USAGE.md docs/EXTERNAL-COOLING-PROTOCOL.md docs/EXTERNAL-COOLING-V1-VECTORS.json "$RUNNER_TEMP/simulator/"
          (cd "$RUNNER_TEMP/simulator" && zip -r "$GITHUB_WORKSPACE/release-assets/Esp32Simulator-$PREVIEW_TAG-win-x64.zip" .)
          cp docs/EXTERNAL-COOLING-{USAGE,PROTOCOL,AUDIT,VALIDATION}.md release-assets/
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          reports=list(Path("validation-evidence").rglob("validation.json"))
          assert len(reports)==1, "Expected a single validation report"
          report=json.loads(reports[0].read_text(encoding="utf-8-sig"))
          assert report["sourceHead"]==os.environ["SOURCE_SHA"]
          assert report["physicalEsp32Pass"] is False and report["physicalNotebookWrites"] is False
          assert report["offlinePackageAuditSkipped"] is False
          assert len(report["checks"])==18 and all(c["exitCode"]==0 for c in report["checks"])
          root=Path("release-assets")
          (root/"EXTERNAL-COOLING-CI-VALIDATION.json").write_text(json.dumps(report,indent=2)+"\n")
          simulator=root/("Esp32Simulator-"+os.environ["PREVIEW_TAG"]+"-win-x64.zip")
          (root/(simulator.name+".sha256")).write_text(hashlib.sha256(simulator.read_bytes()).hexdigest()+"  "+simulator.name+"\n")
          files=[{"name":p.name,"size":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.iterdir()) if p.is_file()]
          (root/"PREVIEW-PROVENANCE.json").write_text(json.dumps({"tag":os.environ["PREVIEW_TAG"],"sourceHead":os.environ["SOURCE_SHA"],"internalProductVersion":"1.2.9","prerelease":True,"physicalEsp32Pass":False,"productBuildRun":38813973727,"validationRun":38813973870,"publicationRun":os.environ["GITHUB_RUN_ID"],"files":files},indent=2)+"\n")
          PY
      - name: Stage draft with verified downloads
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          # VictusFanControl v1.2.10-preview.1 — Base externa / ESP32
          
          Preliminar de la fase Windows para una futura base refrigeradora ESP32-C3 por Wi-Fi. Código del [PR #41](https://github.com/Esteban-3055/VictusFanControl/pull/41), commit `bf79edb0fae55c1635dc52aad74d61f10320ff46`.
          
          ## Descargas y prueba
          - **Instalador:** `VictusFanControl-1.2.9-Setup-win-x64.exe`. Es el archivo original del CI validado; esta preliminar conserva la versión interna 1.2.9 y se distingue de la estable por el SHA y estas notas.
          - **Paquete Windows:** `VictusFanControl-1.2.9-win-x64.zip`.
          - **Simulador separado:** `Esp32Simulator-v1.2.10-preview.1-win-x64.zip`. Extraer y ejecutar `Esp32Simulator.exe --port 8765`; requiere .NET 8 Runtime x64.
          - Abrir **Configuración → Base externa / ESP32**, elegir monitorización, activar simulador local (127.0.0.1:8765), generar una clave y escribirla en la entrada oculta del simulador. Guardar y conectar.
          - El módulo comienza deshabilitado. El instalador preserva perfiles y preferencias. Las actualizaciones estables no distribuyen automáticamente esta preliminar.
          
          ## Incluye
          - TCP bidireccional asíncrono con autenticación mutua HMAC, sesiones, secuencias, límites y reconexión.
          - CPU/GPU/RAM, Demanda y Solicitud diferenciadas, modos y validez/antigüedad.
          - Configuración integrada, emparejamiento protegido con DPAPI y funcionamiento en bandeja.
          - Simulador con fallos de red y mensajes fragmentados, inválidos, retrasados y duplicados.
          - Contrato extensible con `extensions.slot1` y `slot2` nulos.
          
          ## Validación y límites
          Los cinco workflows del SHA de producto terminaron correctamente, incluidas 18 comprobaciones de integración y regresión. [Compilación e instalador](https://github.com/Esteban-3055/VictusFanControl/actions/runs/38813973727) · [Pruebas ExternalCooling](https://github.com/Esteban-3055/VictusFanControl/actions/runs/38813973870).
          
          Validado mediante simulador TCP. **No incluye firmware ni acredita funcionamiento físico del ESP32, NTC, LCD o PWM.** Quedan pendientes Wi-Fi/mDNS y suspensión real del equipo. La integración externa no añade escrituras a los controladores internos del notebook. El instalador no dispone de firma Authenticode.
          
          La etiqueta identifica una preliminar; la release estable v1.2.9 permanece vigente y el PR sigue pendiente de revisión.
          
          ## Documentación
          Se adjuntan guía de uso, protocolo, auditoría y resultados. Los archivos `.sha256` y `PREVIEW-PROVENANCE.json` permiten comprobar las descargas y su origen.
          NOTES
          gh release create "$PREVIEW_TAG" release-assets/* --target "$SOURCE_SHA" --title 'VictusFanControl v1.2.10-preview.1 · Base externa / ESP32' --notes-file "$RUNNER_TEMP/preview-notes.md" --prerelease --latest=false --draft
      - name: Verify uploaded bytes before publishing preliminary release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          release=json.loads((Path(os.environ["RUNNER_TEMP"])/"release.json").read_text())
          assert release["draft"] is True and release["prerelease"] is True
          assert release["target_commitish"]==os.environ["SOURCE_SHA"]
          assets={a["name"]:a for a in release["assets"]}
          files={p.name:p for p in Path("release-assets").iterdir() if p.is_file()}
          assert assets.keys()==files.keys()
          for name,p in files.items():
              a=assets[name]
              assert a["state"]=="uploaded" and a["size"]==p.stat().st_size, name
              assert a["digest"]=="sha256:"+hashlib.sha256(p.read_bytes()).hexdigest(), name
          PY
          gh release edit "$PREVIEW_TAG" --draft=false --prerelease --latest=false
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$PREVIEW_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = 'v1.2.9'
          gh release view "$PREVIEW_TAG" --json url,isDraft,isPrerelease,assets
