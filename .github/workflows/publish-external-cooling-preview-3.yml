name: publish-external-cooling-preview-3
on:
  push:
    branches: [release/external-cooling-preview-3]
    paths: [.github/workflows/publish-external-cooling-preview-3.yml]
permissions:
  contents: read
concurrency:
  group: external-cooling-preview-3-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Esteban-3055/VictusFanControl' && github.ref == 'refs/heads/release/external-cooling-preview-3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: bdca3d538175924d2a374066c8e00b121d7ef375
      PREVIEW_TAG: v1.2.11
      BUILD_RUN: 38871309730
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdca3d538175924d2a374066c8e00b121d7ef375
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact source, successful CI, stable preservation and unused tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$PREVIEW_TAG" > "$RUNNER_TEMP/tags.json"
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100" > "$RUNNER_TEMP/checks.json"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = 'v1.2.9'
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          tag=os.environ['PREVIEW_TAG']
          assert not any(r['tag_name']==tag for r in json.loads((tmp/'releases.json').read_text()))
          assert not any(r['ref']=='refs/tags/'+tag for r in json.loads((tmp/'tags.json').read_text()))
          runs=json.loads((tmp/'checks.json').read_text())['workflow_runs']
          for name in ('build','external-cooling','oem-shadow','cpu-rapl','wmi-fan-experiment'):
              matches=[r for r in runs if r['name']==name and r['head_sha']==os.environ['SOURCE_SHA'] and r['head_branch']=='feature/external-cooling-wifi' and r['event']=='push']
              assert matches,name
              run=max(matches,key=lambda r:r['id'])
              assert run['status']=='completed' and run['conclusion']=='success',name
              if name=='build': assert run['id']==int(os.environ['BUILD_RUN'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: VictusFanControl-1.2.11-win-x64-bdca3d538175924d2a374066c8e00b121d7ef375
          path: verified-payload
          github-token: ${{ github.token }}
          run-id: 38871309730
      - uses: actions/download-artifact@v4
        with:
          name: VictusFanControl-1.2.11-Setup-win-x64-bdca3d538175924d2a374066c8e00b121d7ef375
          path: installer-assets
          github-token: ${{ github.token }}
          run-id: 38871309730
      - uses: actions/download-artifact@v4
        with:
          name: external-cooling-validation-bdca3d538175924d2a374066c8e00b121d7ef375
          path: validation-evidence
          github-token: ${{ github.token }}
          run-id: 38871309728
      - name: Verify original product archive, installer and 18 exact-commit fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-github-release.py --payload verified-payload --verified-archive installer-assets/VictusFanControl-1.2.11-win-x64.zip --output release-assets --source-head "$SOURCE_SHA" --build-run-id "$BUILD_RUN" --checks-json "$RUNNER_TEMP/checks.json" --checks-branch feature/external-cooling-wifi
          python scripts/prepare-installer-assets.py --installer installer-assets/VictusFanControl-1.2.11-Setup-win-x64.exe --source-head "$SOURCE_SHA" --payload release-assets/VictusFanControl-1.2.11-win-x64.zip --verify --output release-assets
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('validation-evidence/validation.json').read_text(encoding='utf-8-sig'))
          assert report['sourceHead']==os.environ['SOURCE_SHA']
          assert len(report['checks'])==18 and all(c['exitCode']==0 for c in report['checks'])
          assert report['offlinePackageAuditSkipped'] is False
          assert report['physicalEsp32Pass'] is False and report['physicalNotebookWrites'] is False
          assert 'shared canvas/theme, mode segments, independent save/discard' in Path('validation-evidence/external-cooling-ui-self-test.log').read_text(encoding='utf-8-sig')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare separate simulator, documentation and provenance
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tools/Esp32Simulator/Esp32Simulator.csproj -c Release -r win-x64 --self-contained false -warnaserror -p:VictusProductRelease=true -o "$RUNNER_TEMP/simulator"
          cp docs/EXTERNAL-COOLING-USAGE.md docs/EXTERNAL-COOLING-PROTOCOL.md docs/EXTERNAL-COOLING-V1-VECTORS.json "$RUNNER_TEMP/simulator/"
          (cd "$RUNNER_TEMP/simulator" && zip -r "$GITHUB_WORKSPACE/release-assets/Esp32Simulator-$PREVIEW_TAG-win-x64.zip" .)
          cp docs/EXTERNAL-COOLING-{USAGE,PROTOCOL,AUDIT,VALIDATION,HARDENING}.md docs/EXTERNAL-COOLING-V1-VECTORS.json release-assets/
          cp validation-evidence/validation.json release-assets/EXTERNAL-COOLING-CI-VALIDATION.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('release-assets')
          simulator=root/f"Esp32Simulator-{os.environ['PREVIEW_TAG']}-win-x64.zip"
          (root/(simulator.name+'.sha256')).write_text(hashlib.sha256(simulator.read_bytes()).hexdigest()+'  '+simulator.name+'\n')
          manifest=json.loads(Path('verified-payload/PRODUCT-GUI-MANIFEST.json').read_text(encoding='utf-8-sig'))
          assert manifest['version']=='1.2.11' and manifest['releaseChannel']=='preview'
          record=dict(tag=os.environ['PREVIEW_TAG'],version='1.2.11',prerelease=True,sourceHead=os.environ['SOURCE_SHA'],buildRunId=int(os.environ['BUILD_RUN']),externalCoolingRunId=38871309728,
              physicalEsp32Pass=False,physicalNotebookWrites=False,stableReleasePreserved='v1.2.9',updater129RequiresPreviewOptIn=True,
              assets={p.name:dict(size=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in root.iterdir() if p.is_file()})
          (root/'PREVIEW-PROVENANCE.json').write_text(json.dumps(record,indent=2)+'\n')
          notes=Path('release/RELEASE-NOTES-v1.2.11.md').read_text()
          notes=notes.replace('**Actualizaciones**, activar **Incluir versiones preliminares** y pulsar **Buscar actualizaciones**.',
              '**Actualizaciones** y activar **Incluir versiones preliminares**. Ir a **Configuración → Guardar preferencias** para conservar esa elección; volver a **Actualizaciones** y pulsar **Buscar actualizaciones**.')
          (Path(os.environ['RUNNER_TEMP'])/'preview-notes.md').write_text(notes)
          PY
      - name: Exercise pinned original 1.2.9 updater before publication
        shell: pwsh
        run: ./scripts/test-updater-129-compatibility.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'updater129')
      - name: Stage draft with all assets and verify uploaded bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$PREVIEW_TAG" release-assets/* --target "$SOURCE_SHA" --title 'VictusFanControl v1.2.11 · Preliminar 3 · Base externa / ESP32' --notes-file "$RUNNER_TEMP/preview-notes.md" --draft --prerelease --latest=false
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/staged-releases.json"
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          matches=[r for r in json.loads((tmp/'staged-releases.json').read_text()) if r['tag_name']==os.environ['PREVIEW_TAG']]
          assert len(matches)==1
          r=matches[0]
          assert r['draft'] is True and r['prerelease'] is True and r['target_commitish']==os.environ['SOURCE_SHA']
          assets={a['name']:a for a in r['assets']}
          files={p.name:p for p in Path('release-assets').iterdir() if p.is_file()}
          assert assets.keys()==files.keys()
          for name,p in files.items():
              a=assets[name]
              assert a['state']=='uploaded' and a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest(),name
          (tmp/'release-id.txt').write_text(str(r['id']))
          PY
      - name: Publish verified preview while preserving stable latest
        shell: bash
        run: |
          set -euo pipefail
          id=$(cat "$RUNNER_TEMP/release-id.txt")
          gh api --method PATCH "repos/$GH_REPO/releases/$id" -F draft=false -F prerelease=true -f make_latest=false > "$RUNNER_TEMP/published.json"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$PREVIEW_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = 'v1.2.9'
      - name: Verify public discovery and full download with original 1.2.9 updater
        shell: pwsh
        run: |
          for($attempt=1;$attempt -le 4;$attempt++) {
            try {
              ./scripts/test-updater-129-compatibility.ps1 -Live -OutputDirectory (Join-Path $env:RUNNER_TEMP 'updater129')
              break
            } catch {
              if($attempt -eq 4){throw}
              Write-Host 'Waiting for public release metadata propagation before retrying the original updater.'
              Start-Sleep -Seconds 15
            }
          }
      - name: Attach compatibility evidence and confirm public metadata
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/updater129/cache/compatibility.json" UPDATER-1.2.9-COMPATIBILITY.json
          gh release upload "$PREVIEW_TAG" UPDATER-1.2.9-COMPATIBILITY.json
          gh api "repos/$GH_REPO/releases/tags/$PREVIEW_TAG" > "$RUNNER_TEMP/final.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'final.json').read_text())
          assert r['draft'] is False and r['prerelease'] is True and r['target_commitish']==os.environ['SOURCE_SHA']
          assert 'Guardar preferencias' in r['body']
          assert any(a['name']=='VictusFanControl-1.2.11-Setup-win-x64.exe' and a['state']=='uploaded' and a['digest'].startswith('sha256:') for a in r['assets'])
          print(r['html_url'])
          PY
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = 'v1.2.9'
