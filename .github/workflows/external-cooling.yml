name: external-cooling
on:
  push:
    branches: ['feature/external-cooling-wifi']
  pull_request:
    branches: [main, 'feature/fan-54-52-preview']
    paths: ['src/**', 'tools/Esp32Simulator/**', 'tools/ExternalCooling.Tests/**', 'scripts/test-external-cooling.ps1', '.github/workflows/external-cooling.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release, real loopback TCP, DPAPI, WinForms lifecycle and internal regressions
        shell: pwsh
        run: ./scripts/test-external-cooling.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-cooling-validation-${{ github.sha }}
          path: |
            logs/external-cooling-self-test/*.log
            logs/external-cooling-self-test/*.png
            logs/external-cooling-self-test/performance.json
            logs/external-cooling-self-test/validation.json
          if-no-files-found: warn
