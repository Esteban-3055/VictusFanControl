[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:supermini-bench]
extends = env:supermini
build_flags = ${env:supermini.build_flags} -DVICTUS_ENABLE_PWM=1
